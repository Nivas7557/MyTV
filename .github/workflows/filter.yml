name: Generate IPTV Playlists

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run script
      run: python process_ap.py

    - name: Commit and push if changed
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add custom_tel.m3u custom_ap.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate IPTV playlists" && git push)
