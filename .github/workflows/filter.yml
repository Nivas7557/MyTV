name: Auto Filter Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process Telugu Playlist
        run: |
          curl -s https://iptv-org.github.io/iptv/languages/tel.m3u -o original_tel.m3u
          grep -v -E "Gospel|Calvary|Divyavani|Nireekshana|Subhavaartha|Shopping" original_tel.m3u > custom_tel.m3u

      - name: Run Python Script for All India Streams
        run: |
          python3 process_india.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add custom_tel.m3u custom_india.m3u
          git commit -m "Auto-updated custom_tel and custom_india playlists" || exit 0
          git push
