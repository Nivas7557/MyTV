name: Filter M3U Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download and Filter Telugu M3U
        run: |
          curl -s https://iptv-org.github.io/iptv/languages/tel.m3u -o original_tel.m3u
          grep -v -E "Gospel|Bhakthi|Shopping" original_tel.m3u > custom_tel.m3u

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add custom_tel.m3u
          git commit -m "Auto-updated filtered playlist" || exit 0
          git push
