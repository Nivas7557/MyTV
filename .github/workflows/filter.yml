name: Generate IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Python Script to Generate Playlists
        run: |
          python3 process_ap.py

      - name: Commit and Push Playlists
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add custom_tel.m3u custom_ap.m3u
          git commit -m "Auto-generated custom_tel.m3u and custom_ap.m3u" || exit 0
          git push
